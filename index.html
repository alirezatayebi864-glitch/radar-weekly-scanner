
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR Weekly Scanner</title>
<style>
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;padding:18px}
h1{color:#38bdf8;margin-bottom:5px}
.sub{color:#aab6c8;font-size:13px}
.panel{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:0;margin-top:10px;font-size:15px}
button{background:#0284c7;color:white;border:0;padding:12px 18px;border-radius:8px;margin-top:10px;font-size:15px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{padding:12px 7px;text-align:center;border-bottom:1px solid #334155;white-space:nowrap}
th{color:#38bdf8}
.green{color:#4ade80}
.red{color:#fb7185}
.small{color:#94a3b8;font-size:12px}
.wrap{overflow-x:auto}
</style>
</head>
<body>

<h1>RADAR WEEKLY</h1>
<div class="sub">اسکنر حمایت و مقاومت هفتگی قراردادهای توبیت</div>

<div class="panel">
  <label>حداکثر فاصله از حمایت یا مقاومت (درصد)</label>
  <input id="distance" type="number" value="1" min="0.1" step="0.1">
  <button onclick="loadData()">بروزرسانی اطلاعات</button>
  <p id="status" class="small">در حال دریافت اطلاعات...</p>
  <p id="updated" class="small"></p>
</div>

<div class="panel wrap">
<table>
<thead>
<tr>
<th>ارز</th>
<th>قیمت</th>
<th>حمایت هفتگی</th>
<th>فاصله حمایت</th>
<th>مقاومت هفتگی</th>
<th>فاصله مقاومت</th>
</tr>
</thead>
<tbody id="results">
<tr><td colspan="6">در حال بارگذاری...</td></tr>
</tbody>
</table>
</div>

<script>
async function loadData(){
  const status=document.getElementById("status");
  const results=document.getElementById("results");
  const limit=Number(document.getElementById("distance").value)||1;

  status.textContent="در حال دریافت اطلاعات...";
  results.innerHTML='<tr><td colspan="6">لطفاً صبر کنید...</td></tr>';

  try{
    const response=await fetch("./data.json?t="+Date.now(),{cache:"no-store"});
    if(!response.ok) throw new Error("خطا در دریافت فایل اطلاعات");

    const data=await response.json();
    if(!Array.isArray(data.items)) throw new Error("ساختار اطلاعات معتبر نیست");

    const coins=data.items.filter(x=>
      Number(x.support_distance)<=limit ||
      Number(x.resistance_distance)<=limit
    );

    coins.sort((a,b)=>Number(a.distance)-Number(b.distance));

    results.innerHTML="";

    if(coins.length===0){
      results.innerHTML='<tr><td colspan="6">ارزی نزدیک به محدوده انتخابی پیدا نشد.</td></tr>';
    }

    for(const x of coins){
      const nearSupport=Number(x.support_distance)<=limit;
      const nearResistance=Number(x.resistance_distance)<=limit;

      const row=document.createElement("tr");
      row.innerHTML=`
        <td>${x.symbol.replace("-SWAP-USDT","")}</td>
        <td>${Number(x.price).toPrecision(6)}</td>
        <td>${Number(x.support).toPrecision(6)}</td>
        <td class="${nearSupport?'green':''}">${x.support_distance}%</td>
        <td>${Number(x.resistance).toPrecision(6)}</td>
        <td class="${nearResistance?'red':''}">${x.resistance_distance}%</td>
      `;
      results.appendChild(row);
    }

    status.textContent="تعداد ارزهای نزدیک به محدوده: "+coins.length;
    document.getElementById("updated").textContent=
      "آخرین دریافت اطلاعات: "+new Date(data.updated_at).toLocaleString("fa-IR");

  }catch(error){
    status.textContent="خطا: "+error.message;
    results.innerHTML='<tr><td colspan="6">اطلاعات دریافت نشد.</td></tr>';
  }
}

loadData();
</script>
</body>
</html>
